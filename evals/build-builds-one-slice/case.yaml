# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-builds-one-slice
description: On the default branch with an uncommitted one-slice plan, /build S1 creates the plan's branch, has a sonnet coding agent build the slice test-first behind the gate in arlo-features commits, marks the row done, leaves main alone and stops for review.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: switches-to-the-plan-branch
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/feature/tracking'
  - name: leaves-main-alone
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: commits-the-behaviour-in-arlo-features
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\tcommit[^:\n]*: \^ F '
  - name: commits-only-arlo-subjects
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\tcommit[^:\n]*: (?![.^!@] [FBRDEfbrdet] )'
    match: not_contains
  - name: commits-the-plan
    type: regex
    target: {source: file, path: .git/index}
    pattern: 'docs/work/tracking/plan\.md'
  - name: writes-the-acceptance-test
    type: regex
    target: {source: file, path: tests/test_shipping.py}
    pattern: 'def test_a_shipped_order_message_links_its_tracking_page'
  - name: builds-the-behaviour
    type: regex
    target: {source: file, path: notify/shipping.py}
    pattern: 'tracking_url'
  - name: marks-the-slice-done
    type: regex
    target: {source: file, path: docs/work/tracking/plan.md}
    pattern: '^\| *S1 *\|[^\n]*\| *done *\|'
    flags: m
  - name: runs-the-gate
    type: tool_used
    tool: Bash
    input_match: 'scripts/gate\.py'
    min: 1
  - name: starts-a-sonnet-coding-agent
    type: tool_used
    tool: Agent
    input_match: 'sonnet'
    min: 1
  - name: never-skips-the-hook
    type: tool_used
    tool: Bash
    input_match: '--no-verify|\s-n\b[^|;&]*\bcommit|commit\b[^|;&]*\s-n\b'
    min: 0
    max: 0
  - name: stops-for-review
    type: llm
    criteria: >-
      The final response reports slice S1 as built and asks the user to review it,
      naming its commits or the branch they are on.
