# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-stops-on-an-unknown-commit-style
description: When commit_style in .agents/config.yml names neither a preset nor an existing file, /build S1 stops naming the value and the line to change before it creates a branch, starts a coding agent or commits.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: names-the-unknown-style
    type: llm
    criteria: >-
      The final response reports that the configured `commit_style` value `house-style` is neither a preset (arlo, arlo-features, conventional or plain) nor an existing file.
  - name: names-the-line-to-change
    type: llm
    criteria: >-
      The final response says which line of .agents/config.yml to change so that `commit_style` names a preset or a style file.
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
