# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-lists-and-suggests
description: Plain /build lists every slice with its status, suggests the first unblocked todo slice as /build S3 and not the earlier S2, which waits for S3, and creates no branch, starts no coding agent and commits nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: lists-s1-as-done
    type: regex
    pattern: 'S1[^\n]*\bdone\b'
  - name: lists-s2-as-todo
    type: regex
    pattern: 'S2[^\n]*\btodo\b'
  - name: lists-s3-as-todo
    type: regex
    pattern: 'S3[^\n]*\btodo\b'
  - name: suggests-the-first-unblocked-slice
    type: regex
    pattern: '/build S3'
  - name: suggests-no-blocked-slice
    type: regex
    pattern: '/build S2'
    match: not_contains
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
