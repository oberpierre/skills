# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-refuses-to-close-off-the-plan-branch
description: With every slice done and HEAD on main, /build close tracking refuses, naming feature/tracking as the branch to switch to, and leaves the plan in place with nothing committed, pushed, merged or opened as a pull request.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build close tracking
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: names-the-plan-branch
    type: regex
    target: last_message
    pattern: 'feature/tracking'
  - name: says-to-switch
    type: regex
    target: last_message
    pattern: '(switch|check out|checkout|move)[^\n]*feature/tracking|feature/tracking[^\n]*(switch|check out|checkout)'
    flags: i
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: keeps-the-plan
    type: regex
    target: {source: file, path: docs/work/tracking/plan.md}
    pattern: '^\| *S1 *\|'
    flags: m
  - name: commits-nothing-on-main
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|commit: Add the plan$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: commits-nothing-on-the-plan-branch
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\t(?!branch: Created from|commit: Add the plan$)'
    flags: m
    match: not_contains
  - name: pushes-nothing
    type: tool_used
    tool: Bash
    input_match: 'git\s+push'
    min: 0
    max: 0
  - name: merges-nothing
    type: tool_used
    tool: Bash
    input_match: 'git\s+merge\b(?!-base)'
    min: 0
    max: 0
  - name: deletes-no-file
    type: tool_used
    tool: Bash
    input_match: 'git\s+rm\b|\brm\b'
    min: 0
    max: 0
  - name: opens-no-pull-request
    type: tool_used
    tool: Bash
    input_match: 'gh\s+pr\s+create'
    min: 0
    max: 0
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
