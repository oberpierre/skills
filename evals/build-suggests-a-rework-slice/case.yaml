# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-suggests-a-rework-slice
description: Plain /build suggests a rework slice as /build S2, ahead of the todo S3 that it blocks, and changes nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: lists-s2-as-rework
    type: regex
    pattern: 'S2[^\n]*\brework\b'
  - name: suggests-the-rework-slice
    type: regex
    pattern: '/build S2'
  - name: suggests-no-blocked-slice
    type: regex
    pattern: '/build S3'
    match: not_contains
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
