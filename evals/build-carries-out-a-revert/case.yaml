# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-carries-out-a-revert
description: Under arlo-features and tracker github, /build S2 on a revert rework drops S2's commit by interactive rebase with the gate run on every rewritten commit, removes the S2 row in the final history while S1 stays done, leaves no sender code behind, challenges the slice id once, and closes S2's reopened issue as not planned once, never as completed, leaving S1's closed issue and the parent alone.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S2
  max_turns: 80
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: starts-a-coding-agent
    type: tool_used
    tool: Agent
    min: 1
  - name: drops-the-commits-by-rebase
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\trebase[^\n]*\(finish\)'
  - name: adds-no-revert-commit
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\tcommit[^:\n]*: Revert'
    match: not_contains
  - name: gates-the-first-later-commit
    type: regex
    target: {source: file, path: .eval-rebase.log}
    pattern: '^rebase:\^ t A recorder starts empty$'
    flags: m
  - name: gates-the-second-later-commit
    type: regex
    target: {source: file, path: .eval-rebase.log}
    pattern: '^rebase:\^ t A notifier is a class$'
    flags: m
  - name: the-final-history-has-no-s2-row-and-keeps-s1-done
    type: regex
    target: {source: file, path: .eval-head.log}
    pattern: '(?:^|\n)head:S1:done S2:gone S3:gone\n?$'
  - name: removes-the-sender-code
    type: regex
    target: {source: file, path: notify/email.py}
    pattern: 'sender'
    match: not_contains
  - name: keeps-the-slice-built-before
    type: regex
    target: {source: file, path: notify/shipping.py}
    pattern: 'tracking_url'
  - name: challenges-the-slice-id-once
    type: tool_used
    tool: Skill
    input_match: 'plan\.md\s+S2\s'
    min: 1
    max: 1
  - name: never-skips-the-hook
    type: tool_used
    tool: Bash
    input_match: '--no-verify|\s-n\b[^|;&]*\bcommit|commit\b[^|;&]*\s-n\b'
    min: 0
    max: 0
  - name: closes-the-removed-issue-as-not-planned
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 3\b(?=[^\n]*--reason not planned)'
    flags: m
  - name: comments-which-rework-reverted-it
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 3\b(?=[^\n]*--comment Reverted by rework of S2\b)'
    flags: m
  - name: never-closes-the-removed-issue-as-completed
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 3 --reason completed'
    flags: m
    match: not_contains
  - name: closes-no-other-issue
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue (close|reopen|edit) [12]\b'
    flags: m
    match: not_contains
  - name: closes-each-issue-at-most-once
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close (\d+)\b[^\n]*\n(?:[^\n]*\n)*?issue close \1\b'
    flags: m
    match: not_contains
  - name: finds-issues-by-number-only
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^(issue list|search)\b'
    flags: m
    match: not_contains
