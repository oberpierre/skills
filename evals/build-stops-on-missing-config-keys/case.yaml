# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-stops-on-missing-config-keys
description: When .agents/config.yml has no gate and no commit_style, and a tracker github with gh missing, /build S1 stops naming each problem and the line to change before it creates a branch, starts a coding agent or commits.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: names-the-missing-gate
    type: llm
    criteria: >-
      The final response reports that the `gate` key is missing from .agents/config.yml.
  - name: names-the-line-to-change-for-the-gate
    type: llm
    criteria: >-
      The final response says which line of .agents/config.yml to add or change so that `gate` holds a command.
  - name: names-the-missing-commit-style
    type: llm
    criteria: >-
      The final response reports that the `commit_style` key is missing from .agents/config.yml.
  - name: names-the-line-to-change-for-the-commit-style
    type: llm
    criteria: >-
      The final response says which line of .agents/config.yml to add or change so that `commit_style` names a preset or a style file.
  - name: names-the-missing-gh
    type: llm
    criteria: >-
      The final response reports that `tracker: github` needs the gh CLI, which is missing or cannot authenticate.
  - name: names-the-line-to-change-for-gh
    type: llm
    criteria: >-
      The final response says to install or log in to gh, or to change the `tracker` line of .agents/config.yml to markdown.
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
