# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-stops-on-an-unreadable-argument
description: With two plans, the misspelled /build shiping-notes S3 stops naming the word it could not read and both plans it found, and creates no branch, starts no coding agent and commits nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build shiping-notes S3
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: names-the-word-it-could-not-read
    type: regex
    pattern: 'shiping-notes[^\n]*(not|unknown|no such|isn.t|neither)|(not|unknown|no such|neither)[^\n]*shiping-notes'
    flags: i
  - name: names-the-first-plan
    type: regex
    pattern: 'shipping-notes'
  - name: names-the-second-plan
    type: regex
    pattern: 'docs/work/tracking|`tracking`|^[\s*\-]*tracking[\s*\-:,.]*$|(and|or|,) tracking\b'
    flags: m
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: creates-no-branch-for-the-other-plan
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: 'feature/tracking'
    match: not_contains
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
