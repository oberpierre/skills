# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-stops-on-a-table-missing-a-column
description: When the plan's table lacks the Blocked by column, and under tracker github the Issue column, /build S1 stops naming both missing columns, and /slice to mirror the slices, before it creates a branch, starts a coding agent or commits.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: names-the-missing-blocked-by-column
    type: llm
    criteria: >-
      The final response reports that the slices table is missing the `Blocked by` column.
  - name: names-the-missing-issue-column
    type: llm
    criteria: >-
      The final response reports that the slices table has no `Issue` column, which tracker github needs.
  - name: names-slice
    type: regex
    target: last_message
    pattern: '/slice'
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
