# allow-tools: Write Edit Bash(git:*) Bash(test:*)
# model: opus
schema_version: "1.0"
name: challenge-plan-second-mechanism
description: A plan challenge reports a plan that sends texts through a second path beside the existing Notifier, as a finding with a kind and a location, and edits nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /challenge docs/work/sms/plan.md
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: reports-the-second-mechanism
    type: llm
    criteria: >-
      The repository sends notifications through a Notifier protocol (notify/notifier.py) that
      on_order_shipped calls for every notifier in a list, with EmailNotifier as one of them. The
      plan instead adds a separate send_sms function called directly from on_order_shipped. The
      response passes if it reports, as one of its findings, that the plan builds a second
      sending path beside the existing Notifier mechanism (or says SMS should be another
      Notifier implementation).
  - name: states-a-kind
    type: regex
    pattern: '\b(defect|question)\b'
    flags: i
  - name: states-a-location
    type: regex
    pattern: 'plan\.md(:\d+| *\(?(S1|S2|slice|line))|notifier\.py:\d+|shipping\.py:\d+'
    flags: i
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: reads-the-code
    type: tool_used
    tool: Read
    input_match: 'notify/'
    min: 1
