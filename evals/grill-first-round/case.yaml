# allow-tools: Write Edit
# model: opus
schema_version: "1.0"
name: grill-first-round
description: A first grilling round is a numbered set of questions with recommended answers, asks nothing the repository answers, and builds nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /grill add SMS notifications when an order ships
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: calls-grilling
    type: tool_used
    tool: Skill
    input_match: 'grilling'
    min: 1
  - name: round-format
    type: regex
    pattern: '\*\*Q1\b[\s\S]*➡️[\s\S]*\*\*Q2\b[\s\S]*➡️'
  - name: closing-line
    type: regex
    pattern: 'list the decisions for you to confirm once nothing is open'
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: waits
    type: llm
    criteria: >-
      The response ends by putting its questions to the user and waiting for the answers.
      Recommended answers that mention how something could be built are fine.
      It fails only if the response goes past the questions: it answers them itself and
      carries on, starts writing or changing code, or says it is now going to build.
  - name: names-the-provisioned-provider
    type: regex
    pattern: 'twilio'
    flags: i
  - name: asks-no-fact
    type: llm
    criteria: >-
      The repository configures SMS through Twilio in config/channels.toml, and notifications
      go through a Notifier interface with an EmailNotifier. The response passes if none of its
      questions asks the user for something the repository already answers, such as which SMS
      provider to use, whether SMS is set up, or how notifications are sent today. Stating
      those facts is fine, and so is asking whether to keep or change them.
