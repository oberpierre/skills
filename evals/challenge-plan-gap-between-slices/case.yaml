# allow-tools: Write Edit Bash(git:*) Bash(test:*)
# model: opus
schema_version: "1.0"
name: challenge-plan-gap-between-slices
description: A plan challenge reports the behaviour that falls between two slices, as a finding with a kind and a location, and edits nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /challenge docs/work/sms/plan.md
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: reports-the-gap
    type: llm
    criteria: >-
      The plan's goal is that a customer is texted when their order ships. Its slices build
      SmsNotifier.send, phone_for and the no-phone case, each tested on its own, but none builds
      or tests the step that puts an SmsNotifier, given phone_for, into the notifiers that
      on_order_shipped runs, so no slice delivers the text on an order shipping. The response
      passes if it reports, as one of its findings, that this behaviour falls between the slices
      or that no slice wires them together.
  - name: states-a-kind
    type: regex
    pattern: '\b(defect|question)\b'
    flags: i
  - name: states-a-location
    type: regex
    pattern: 'plan\.md(:\d+| *\(?(S1|S2|slice|line))|notifier\.py:\d+|shipping\.py:\d+'
    flags: i
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
