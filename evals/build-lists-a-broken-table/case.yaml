# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-lists-a-broken-table
description: Plain /build on a plan whose S2 is blocked by a missing S9 and whose S4 is a rework row with no note lists the rows, names both problems and suggests no slice, though S3 is unblocked, and changes nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: lists-the-rows
    type: regex
    pattern: 'S3[^\n]*\btodo\b'
  - name: names-the-missing-blocker
    type: regex
    pattern: 'S9'
  - name: names-the-empty-rework-note
    type: regex
    pattern: '(empty|no|without|missing)[^\n]*note|note[^\n]*(empty|missing)'
    flags: i
  - name: suggests-no-slice
    type: regex
    pattern: '/build (\S+ )?S[0-9]'
    match: not_contains
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
