# allow-tools: Write Edit
schema_version: "1.0"
name: slice-finds-the-only-plan
description: When the argument names no plan, slice uses the only plan under docs/work/ and treats the whole argument as the request.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /slice cover the opt-out decision too
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: reads-the-only-plan
    type: tool_used
    tool: Read
    input_match: 'docs/work/sms/plan\.md'
    min: 1
  - name: numbers-on
    type: regex
    pattern: '\| *S3 *\|[^\n]*\| *todo *\|'
  - name: covers-the-request
    type: llm
    criteria: >-
      The response proposes a table of slices in which a slice with status todo carries out
      the decision that a customer who has opted out of texts gets none.
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
