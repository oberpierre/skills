# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-carries-out-a-rebuild
description: Under arlo-features and tracker github, /build S2 on a rebuild rework drops S2's commit in an interactive rebase, rebuilds the carrier line test-first at that position, replays the later commits with the gate run on each, ends with S2 done and its Note cleared in the final history, and closes S2's reopened issue as completed once, only after the committed plan has S2 done, leaving S1's closed issue and the parent alone.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S2
  max_turns: 100
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: starts-a-coding-agent
    type: tool_used
    tool: Agent
    min: 1
  - name: rewrites-history-by-rebase
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\trebase[^\n]*\(finish\)'
  - name: rebuilds-the-carrier-line
    type: regex
    target: {source: file, path: notify/shipping.py}
    pattern: 'Carrier: '
  - name: the-built-carrier-form-is-gone
    type: regex
    target: {source: file, path: notify/shipping.py}
    pattern: ' via '
    match: not_contains
  - name: the-test-pins-the-rebuilt-form
    type: regex
    target: {source: file, path: tests/test_shipping.py}
    pattern: 'Carrier: DHL'
  - name: gates-the-first-later-commit
    type: regex
    target: {source: file, path: .eval-rebase.log}
    pattern: '^rebase:\^ t A recorder starts empty$'
    flags: m
  - name: gates-the-second-later-commit
    type: regex
    target: {source: file, path: .eval-rebase.log}
    pattern: '^rebase:\^ t A notifier is a class$'
    flags: m
  - name: the-final-history-has-s2-done-with-its-note-cleared
    type: regex
    target: {source: file, path: .eval-head.log}
    pattern: '(?:^|\n)head:S1:done S2:done S3:gone\n?$'
  - name: challenges-the-slice-id-once
    type: tool_used
    tool: Skill
    input_match: 'plan\.md\s+S2\s'
    min: 1
    max: 1
  - name: never-skips-the-hook
    type: tool_used
    tool: Bash
    input_match: '--no-verify|\s-n\b[^|;&]*\bcommit|commit\b[^|;&]*\s-n\b'
    min: 0
    max: 0
  - name: closes-the-reopened-issue-as-completed
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 3 --reason completed'
    flags: m
  - name: closes-it-only-after-the-committed-row-is-done
    type: regex
    target: {source: file, path: gh-state.log}
    pattern: '^issue close 3 --reason completed \| S1=done S2=done$'
    flags: m
  - name: closes-no-other-issue
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue (close|reopen|edit) [12]\b'
    flags: m
    match: not_contains
  - name: closes-each-issue-at-most-once
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close (\d+)\b[^\n]*\n(?:[^\n]*\n)*?issue close \1\b'
    flags: m
    match: not_contains
  - name: finds-issues-by-number-only
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^(issue list|search)\b'
    flags: m
    match: not_contains
