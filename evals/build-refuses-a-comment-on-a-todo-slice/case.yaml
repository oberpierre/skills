# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-refuses-a-comment-on-a-todo-slice
description: /build S1 with a comment refuses when S1 is still todo, saying to run /build S1 first, and starts no agent, writes nothing and rewrites no history.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1 Please end the tracking sentence with a full stop.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: says-to-build-the-slice-first
    type: regex
    pattern: 'run[^\n]*`?/build S1`?[^\n]*first|first[^\n]*`?/build S1`?'
    flags: i
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: rewrites-nothing
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\t(rebase|commit[^:\n]*: fixup!)'
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
