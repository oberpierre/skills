# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-keeps-history-under-arlo-on-a-comment
description: Under arlo, /build S1 with a review comment makes the correction a commit of its own and rewrites no history, leaving the earlier commits where they were.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1 The tracking sentence should end with a full stop after the link.
  max_turns: 80
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: starts-a-coding-agent
    type: tool_used
    tool: Agent
    min: 1
  - name: fixes-the-sentence
    type: regex
    target: {source: file, path: notify/shipping.py}
    pattern: 'Track it at \{tracking_url\}\.'
  - name: adds-a-correction-commit
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\tcommit: (?!fixup!|Use arlo)[^\n]*\n?$'
  - name: rewrites-no-history
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\t(rebase|reset|commit \(amend\)|commit[^:\n]*: fixup!)'
    match: not_contains
  - name: keeps-s1-done
    type: regex
    target: {source: file, path: docs/work/shipping-notes/plan.md}
    pattern: '^\| *S1 *\|[^\n]*\| *done *\|'
    flags: m
  - name: never-skips-the-hook
    type: tool_used
    tool: Bash
    input_match: '--no-verify|\s-n\b[^|;&]*\bcommit|commit\b[^|;&]*\s-n\b'
    min: 0
    max: 0
