# allow-tools: Write Edit Bash Bash(git:*) Bash(test:*)
# model: opus
schema_version: "1.0"
name: slice-challenges-changed-slices
description: A later run that changes slices challenges only the changed ones, by id, and touches no issue before the challenge's answers are recorded.
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: "Approved, go ahead."
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
graders:
  - name: challenges-the-changed-slice
    type: tool_used
    tool: Skill
    input_match: 'skills:challenge"[\s\S]*"docs/work/prefix/plan\.md S1"'
    min: 1
  - name: challenges-neither-the-whole-plan-nor-all-slices
    type: tool_used
    tool: Skill
    input_match: 'skills:challenge"[\s\S]*"docs/work/prefix/plan\.md( slices)?"'
    min: 0
    max: 0
  - name: mirrors-nothing-before-the-answers
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue (edit|close|reopen|create)\b'
    flags: m
    match: not_contains
