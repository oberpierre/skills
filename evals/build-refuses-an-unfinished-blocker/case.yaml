# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-refuses-an-unfinished-blocker
description: /build S2 refuses when S1, which S2 is blocked by, is still todo, naming S1, and creates no branch, starts no coding agent and commits nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S2
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: names-the-blocker
    type: regex
    pattern: 'S1[^\n]*(todo|not (yet )?done|unfinished|blocks?|blocked)|(blocked|blocks?)[^\n]*S1'
    flags: i
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
