# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-follows-the-plain-style
description: "With commit_style: plain, /build S1 writes every commit of the slice as a short description with no type, marker or ticket prefix or suffix, and never a fixup."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: commits-the-slice-on-the-plan-branch
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\tcommit[^:\n]*: '
  - name: no-subject-has-a-type-or-marker-prefix
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\tcommit[^:\n]*: ([.^!@] [A-Za-z] |[a-z]+(\([^)\n]+\))?!?: |fixup!)'
    match: not_contains
  - name: no-subject-has-a-ticket
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\tcommit[^:\n]*: .*(\[[A-Z]+-[0-9]+\]|#[0-9]+)\s*$'
    flags: m
    match: not_contains
  - name: describes-the-change
    type: regex
    target: {source: file, path: .git/logs/refs/heads/feature/tracking}
    pattern: '\tcommit[^:\n]*: [A-Z][^\n]*[a-z]'
  - name: runs-the-gate
    type: tool_used
    tool: Bash
    input_match: 'scripts/gate\.py'
    min: 1
  - name: never-skips-the-hook
    type: tool_used
    tool: Bash
    input_match: '--no-verify|\s-n\b[^|;&]*\bcommit|commit\b[^|;&]*\s-n\b'
    min: 0
    max: 0
  - name: commits-the-plan-in-the-first-commit
    type: regex
    target: {source: file, path: .eval-commits.log}
    pattern: '\A[^\n]*docs/work/tracking/plan\.md'
  - name: sets-the-row-to-done-in-the-last-commit-only
    type: regex
    target: {source: file, path: .eval-commits.log}
    pattern: '\A(?:(?![^\n]*done:S1)[^\n]*\n)*[^\n]*done:S1[^\n]*\n*\Z'
  - name: commits-a-test-before-or-with-the-code
    type: regex
    target: {source: file, path: .eval-commits.log}
    pattern: '\A(?:(?![^\n]*(?:tests/|notify/))[^\n]*\n)*(?![^\n]*tests/)[^\n]*notify/'
    match: not_contains
