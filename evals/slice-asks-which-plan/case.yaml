# allow-tools: Write Edit
# model: opus
schema_version: "1.0"
name: slice-asks-which-plan
description: When no plan is named and docs/work/ holds several plans, slice asks which plan to use and writes nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /slice the remaining decisions
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: names-both-plans
    type: regex
    pattern: '(sms[\s\S]*digest|digest[\s\S]*sms)'
  - name: proposes-no-slices
    type: regex
    pattern: '\| *S\d+ *\|[^\n]*\| *todo *\|'
    match: not_contains
  - name: asks-which-plan
    type: llm
    criteria: >-
      The response ends by asking the user which of the plans to slice.
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
