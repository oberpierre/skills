# allow-tools: Write Edit
schema_version: "1.0"
name: slice-stops-on-a-broken-table
description: On a slices table with an unknown status, slice stops and reports the problem instead of proposing slices.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /slice docs/work/sms/plan.md
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: names-the-status
    type: regex
    pattern: '`?wip`?'
  - name: proposes-no-slices
    type: regex
    pattern: '\| *S\d+ *\|[^\n]*\| *todo *\|'
    match: not_contains
  - name: stops-and-reports
    type: llm
    criteria: >-
      The response reports that the plan's slices table has a status that is not one of todo,
      done and rework, and ends without proposing slices.
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
