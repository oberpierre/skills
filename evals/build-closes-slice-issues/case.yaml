# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-closes-slice-issues
description: With tracker github, /build S1 closes S1's issue as completed once its row is done, and leaves the parent and S2's issue open.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build S1
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: marks-the-slice-done
    type: regex
    target: {source: file, path: docs/work/tracking/plan.md}
    pattern: '^\| *S1 *\|[^\n]*\| *done *\|'
    flags: m
  - name: closes-the-slice-issue-as-completed
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 2 --reason completed'
    flags: m
  - name: closes-nothing-else
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue (close|reopen|edit) (1|3)\b'
    flags: m
    match: not_contains
  - name: finds-issues-by-number-only
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^(issue list|search)\b'
    flags: m
    match: not_contains
  - name: the-recorded-issue-ends-closed
    type: regex
    target: {source: file, path: .gh-issues/2.json}
    pattern: '"state": "CLOSED"'
