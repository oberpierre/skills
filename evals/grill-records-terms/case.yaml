schema_version: "1.0"
name: grill-records-terms
description: Grilling records a settled term in GLOSSARY.md and writes an ADR only for a decision that meets the bar.
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: >-
    Q1 no: change the Notifier protocol so send receives the whole Customer instead of a
    customer_id. Every channel needs different contact details, and I want that settled once
    for all of them rather than one lookup per channel. Q2 to Q10 yes. And let's be precise
    with words: a channel is one way of reaching a customer, so email and SMS are channels,
    and a Notifier is the code that sends through one channel.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
graders:
  - name: glossary-exists
    type: file_exists
    path: GLOSSARY.md
  - name: glossary-defines-channel
    type: regex
    target:
      source: file
      path: GLOSSARY.md
    pattern: '\*\*Channel\*\*'
    flags: i
  - name: one-adr-written
    type: tool_used
    tool: Write
    input_match: 'docs/adr/'
    min: 1
    max: 1
  - name: adr-is-the-protocol-change
    type: llm
    focus: files
    criteria: >-
      Exactly one ADR exists under docs/adr/, and it records the decision to change the
      Notifier protocol so that send receives the whole Customer, with the reason the user
      gave. It fails if there is no ADR, if there are several, or if the ADR records a routine
      choice such as the message text, retries or the test plan.
