# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-reads-its-arguments
description: With two plans, /build shipping-notes S3 builds S3 of the plan named, on that plan's branch, and leaves the other plan's table and branch untouched.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build shipping-notes S3
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: switches-to-the-named-plans-branch
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/feature/shipping-notes'
  - name: marks-s3-done-in-the-named-plan
    type: regex
    target: {source: file, path: docs/work/shipping-notes/plan.md}
    pattern: '^\| *S3 *\|[^\n]*\| *done *\|'
    flags: m
  - name: leaves-the-other-plan-untouched
    type: regex
    target: {source: file, path: docs/work/tracking/plan.md}
    pattern: '\| *(done|rework) *\|'
    match: not_contains
  - name: creates-no-branch-for-the-other-plan
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: 'feature/tracking'
    match: not_contains
  - name: builds-the-behaviour
    type: regex
    target: {source: file, path: notify/email.py}
    pattern: 'sender'
  - name: starts-a-coding-agent
    type: tool_used
    tool: Agent
    min: 1
  - name: never-skips-the-hook
    type: tool_used
    tool: Bash
    input_match: '--no-verify|\s-n\b[^|;&]*\bcommit|commit\b[^|;&]*\s-n\b'
    min: 0
    max: 0
