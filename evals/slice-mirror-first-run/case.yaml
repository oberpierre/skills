# allow-tools: Write Edit Bash
# model: opus
schema_version: "1.0"
name: slice-mirror-first-run
description: The first run with tracker github creates a parent issue for the feature and one sub-issue per slice with GitHub's blocking links, each self-contained with a short title and a description, closes the done slices' issues and adds an Issue column to the plan.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /slice docs/work/sms/plan.md mirror the slices to GitHub
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
graders:
  - name: creates-the-parent-first
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^(?:(?!issue create)[^\n]*\n)*issue create (?:(?!\nissue create|Slice:)[\s\S])*\nFeature: sms\s*\nissue create'
  - name: creates-four-issues
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '(^issue create[\s\S]*){4}'
    flags: m
  - name: creates-no-fifth-issue
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '(^issue create[\s\S]*){5}'
    flags: m
    match: not_contains
  - name: makes-the-slices-sub-issues
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '(--parent 1\b[\s\S]*){3}'
  - name: keeps-titles-short
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue create[^\n]*--title (?:(?! --)[^\n]){90}'
    flags: m
    match: not_contains
  - name: describes-before-the-test
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '--body (Acceptance test:|Feature: sms\s*(--|$))'
    flags: m
    match: not_contains
  - name: bodies-name-the-slice
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: 'Slice: S3'
  - name: links-the-blockers
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '(--blocked-by 2\b[\s\S]*){2}'
  - name: closes-the-done-issues
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 2\b[\s\S]*^issue close 3\b|^issue close 3\b[\s\S]*^issue close 2\b'
    flags: m
  - name: leaves-the-parent-and-todo-issue-open
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close [14]\b'
    flags: m
    match: not_contains
  - name: adds-the-issue-column
    type: regex
    target: {source: file, path: docs/work/sms/plan.md}
    pattern: '\| *Note *\| *Issue *\|[\s\S]*\| *S3 *\|[^\n]*\| *#4 *\|'
  - name: writes-the-issue-line
    type: regex
    target: {source: file, path: docs/work/sms/plan.md}
    pattern: '\*\*Issue:\*\* #1\b'
