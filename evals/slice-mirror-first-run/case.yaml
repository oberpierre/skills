# allow-tools: Write Edit Bash
# model: opus
schema_version: "1.0"
name: slice-mirror-first-run
description: The first run with tracker github creates one issue per slice with GitHub's blocking links, closes the done slices' issues and adds an Issue column to the plan.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /slice docs/work/sms/plan.md mirror the slices to GitHub
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
graders:
  - name: creates-three-issues
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue create[^\n]*\n[\s\S]*^issue create[^\n]*\n[\s\S]*^issue create'
    flags: m
  - name: creates-no-fourth-issue
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '(^issue create[\s\S]*){4}'
    flags: m
    match: not_contains
  - name: titles-with-the-behaviour
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue create[^\n]*--title When an order ships, a customer with a phone number gets a text'
    flags: m
  - name: bodies-name-the-slice
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: 'Slice: S3'
  - name: links-the-blockers
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: 'Slice: S2 --blocked-by 1\b[\s\S]*Slice: S3 --blocked-by 1\b|--blocked-by 1\b[^\n]*\n(?:(?!^issue )[^\n]*\n)*Slice: S2[\s\S]*--blocked-by 1\b[^\n]*\n(?:(?!^issue )[^\n]*\n)*Slice: S3'
    flags: m
  - name: closes-the-done-issues
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 1\b[\s\S]*^issue close 2\b|^issue close 2\b[\s\S]*^issue close 1\b'
    flags: m
  - name: leaves-the-todo-issue-open
    type: regex
    target: {source: file, path: gh-calls.log}
    pattern: '^issue close 3\b'
    flags: m
    match: not_contains
  - name: adds-the-issue-column
    type: regex
    target: {source: file, path: docs/work/sms/plan.md}
    pattern: '\| *Note *\| *Issue *\|[\s\S]*\| *S3 *\|[^\n]*\| *#3 *\|'
