# allow-tools: Write Edit Bash SendMessage
# model: sonnet
schema_version: "1.0"
name: build-lists-every-plan
description: With two plans and no plan named, plain /build lists both, suggests /build shipping-notes S3 for the first and /build tracking S2 for the second, asks which plan to build nowhere, and changes nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /build
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Write, Edit, Bash]
graders:
  - name: suggests-the-first-plans-slice
    type: regex
    pattern: '/build shipping-notes S3'
  - name: suggests-the-second-plans-slice
    type: regex
    pattern: '/build tracking S2'
  - name: suggests-no-blocked-slice
    type: regex
    pattern: '/build (shipping-notes S2|tracking S3)'
    match: not_contains
  - name: asks-no-question
    type: regex
    pattern: 'which plan'
    flags: i
    match: not_contains
  - name: stays-on-main
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: 'ref: refs/heads/main'
  - name: starts-no-coding-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: {source: file, path: .git/logs/refs/heads/main}
    pattern: '\t(?!commit \(initial\): Initial commit$|commit: Add the gate$|Branch: renamed )'
    flags: m
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
