name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned to the version the local gate runs, so both judge a skill by the same rules.
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: scripts/gate.sh
